name: DOC NZ Hut Monitor

on:
  push:
    branches: [main]
    paths:
      - 'nz_doc_monitor.py'
      - 'test_nz_doc_monitor.py'
      - '.github/workflows/nz_doc_monitor.yml'
  # GitHub's own cron is unreliable on private repos (it never fired here), so
  # scheduling is handled entirely by an external scheduler (cron-job.org)
  # calling repository_dispatch. The schedule trigger below is disabled; leave
  # it commented in case GitHub cron is ever needed as a fallback.
  # schedule:
  #   - cron: '*/30 * * * *'   # fallback availability check (if GitHub runs it)
  #   - cron: '0 19 * * *'     # fallback daily heartbeat (19:00 UTC ~= 08:00 NZDT)
  workflow_dispatch:
    inputs:
      send_heartbeat:
        description: 'Send a heartbeat notification this run'
        type: boolean
        default: false
  repository_dispatch:
    types: [check, heartbeat]

jobs:
  check-doc-huts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "requests>=2.31" "cloudscraper>=1.2.71"

      # Only on code changes: catch crashes in alert handling before they hit a
      # real opening. Skipped on the 20-minute scheduled checks to keep them fast.
      - name: Run regression tests
        if: github.event_name == 'push'
        run: python -m unittest -v test_nz_doc_monitor

      - name: Execute DOC Availability Check
        env:
          # Required repository secret
          # (Settings -> Secrets and variables -> Actions -> Secrets).
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Send a heartbeat on the daily cron, on a manual run requesting it,
          # or on a repository_dispatch of type "heartbeat".
          SEND_HEARTBEAT: ${{ (github.event.schedule == '0 19 * * *' || github.event.inputs.send_heartbeat == 'true' || github.event.action == 'heartbeat') && '1' || '0' }}
        run: python nz_doc_monitor.py
