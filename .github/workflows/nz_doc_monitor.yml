name: DOC NZ Hut Monitor

on:
  push:
    branches: [main]
    paths:
      - 'nz_doc_monitor.py'
      - '.github/workflows/nz_doc_monitor.yml'
  schedule:
    - cron: '*/20 * * * *'   # availability check, every 20 minutes
    - cron: '0 19 * * *'     # daily heartbeat (19:00 UTC ~= 08:00 NZDT)
  workflow_dispatch:
    inputs:
      send_heartbeat:
        description: 'Send a heartbeat notification this run'
        type: boolean
        default: false

jobs:
  check-doc-huts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "requests>=2.31" "cloudscraper>=1.2.71"

      - name: Execute DOC Availability Check
        env:
          # Override by setting a repository variable named NTFY_TOPIC
          # (Settings -> Secrets and variables -> Actions -> Variables).
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC || 'REDACTED_TOPIC' }}
          # Send a heartbeat only on the daily cron or when manually requested.
          SEND_HEARTBEAT: ${{ (github.event.schedule == '0 19 * * *' || github.event.inputs.send_heartbeat == 'true') && '1' || '0' }}
        run: python nz_doc_monitor.py
